name: Update prices

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC = 6:30am Malaysia time, after US market close
  workflow_dispatch:           # adds a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download latest prices
        run: |
          pip install yfinance pandas
          python export_prices.py
      - name: Build site
        run: |
          mkdir _site
          cp index.html mag7_prices.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
